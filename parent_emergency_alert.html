<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SilentSOS AI – Easy Parent Emergency Trigger</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
      --bg: #050816;
      --card-bg: rgba(13, 20, 36, 0.85);
      --red: #ff003c;
      --red-glow: rgba(255, 0, 60, 0.4);
      --cyan: #00f0ff;
      --green: #00ff88;
      --text: #ffffff;
      --text-muted: #8e9cb0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

    .alert-container { width: 100%; max-width: 580px; background: var(--card-bg); border: 2px solid var(--red); border-radius: 24px; padding: 32px; box-shadow: 0 0 50px var(--red-glow); text-align: center; }

    .header-shield { width: 70px; height: 70px; border-radius: 50%; background: rgba(255, 0, 60, 0.2); border: 2px solid var(--red); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 16px auto; box-shadow: 0 0 25px var(--red-glow); }

    h1 { font-size: 2rem; font-weight: 800; color: white; margin-bottom: 6px; }
    p.sub { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 24px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; margin-bottom: 18px; }
    label { font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; color: var(--cyan); text-transform: uppercase; }

    .input-box { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 14px 16px; color: white; font-size: 1rem; outline: none; transition: all 0.3s ease; }
    .input-box:focus { border-color: var(--red); box-shadow: 0 0 15px var(--red-glow); }

    .status-pill { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 50px; padding: 8px 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--green); margin-bottom: 20px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .btn-main { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s ease; margin-bottom: 12px; }
    .btn-listen { background: linear-gradient(135deg, #00f0ff 0%, #0088cc 100%); color: black; box-shadow: 0 4px 20px rgba(0, 240, 255, 0.3); }
    .btn-call { background: linear-gradient(135deg, #ff003c 0%, #a30026 100%); color: white; box-shadow: 0 4px 25px var(--red-glow); }
    .btn-main:hover { transform: translateY(-2px); }

    .live-log { background: rgba(0, 0, 0, 0.4); border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-muted); margin-top: 16px; max-height: 100px; overflow-y: auto; text-align: left; }

    #map-preview { width: 100%; height: 160px; border-radius: 12px; margin-top: 16px; border: 1px solid rgba(255, 255, 255, 0.15); }
  </style>
</head>
<body>

  <div class="alert-container">
    <div class="header-shield">🛡️</div>
    <h1>Parent Emergency Trigger</h1>
    <p class="sub">Speak your secret code word to automatically call & alert parents with live location.</p>

    <div class="status-pill" id="status-pill">
      <div class="dot"></div>
      <span id="status-pill-text">SPEECH AI & GPS LOCKED</span>
    </div>

    <!-- Step 1: Parent Phone Number -->
    <div class="form-group">
      <label>1. Parent Mobile Number</label>
      <input type="tel" id="parent-phone" class="input-box" value="+1 (555) 987-6543" placeholder="+15559876543 or +919876543210">
    </div>

    <!-- Step 2: Secret Code Word -->
    <div class="form-group">
      <label>2. Secret Code Word / Safe Phrase</label>
      <input type="text" id="secret-codeword" class="input-box" value="Ordering pizza with extra pepperoni" placeholder="e.g. Help me or Emergency">
    </div>

    <!-- Actions -->
    <button class="btn-main btn-listen" id="mic-btn" onclick="toggleVoiceListener()">
      <span>🎙️ Enable Voice Code-Word Detection</span>
    </button>

    <button class="btn-main btn-call" onclick="triggerParentAlertNow()">
      <span>🚨 ALERT PARENTS NOW (Voice Call & SMS)</span>
    </button>

    <!-- Map & Transcript Stream -->
    <div id="map-preview"></div>
    <div class="live-log" id="live-log-box">🎙️ System Ready. Listening for code word...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let recognition = null;
    let isListening = false;
    let map = null, marker = null;
    let lat = 37.7749, lng = -122.4194;

    function initGPSMap() {
      if (typeof L !== 'undefined') {
        map = L.map('map-preview', { center: [lat, lng], zoom: 14, zoomControl: false });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        marker = L.marker([lat, lng]).addTo(map);
      }

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(p => {
          lat = p.coords.latitude;
          lng = p.coords.longitude;
          if (map && marker) {
            marker.setLatLng([lat, lng]);
            map.panTo([lat, lng]);
          }
          logEvent(`📍 GPS Location locked: ${lat.toFixed(4)}° N, ${lng.toFixed(4)}° W`);
        });
      }
    }

    function initSpeechRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return logEvent("⚠️ Browser Speech API not supported.");

      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = function(e) {
        let transcript = '';
        for (let i = e.resultIndex; i < e.results.length; ++i) transcript += e.results[i][0].transcript;
        const text = transcript.toLowerCase().trim();
        const secret = document.getElementById('secret-codeword').value.toLowerCase().trim();

        logEvent(`🎙️ Heard: "${text}"`);

        if (secret && text.includes(secret)) {
          logEvent(`🚨 CODE WORD MATCHED: "${secret}"! Triggering Emergency Dispatch!`);
          triggerParentAlertNow();
        }
      };

      recognition.onend = function() {
        if (isListening) recognition.start();
      };
    }

    function toggleVoiceListener() {
      if (!recognition) initSpeechRecognition();
      const btn = document.getElementById('mic-btn');

      if (!isListening) {
        try {
          recognition.start();
          isListening = true;
          btn.innerHTML = `<span>🛑 Voice Listener Active (Listening...)</span>`;
          btn.style.background = 'linear-gradient(135deg, #00ff88 0%, #009951 100%)';
          logEvent("🟢 Speech Listener Armed. Say your secret code word anytime!");
        } catch(e) {}
      } else {
        isListening = false;
        recognition.stop();
        btn.innerHTML = `<span>🎙️ Enable Voice Code-Word Detection</span>`;
        btn.style.background = 'linear-gradient(135deg, #00f0ff 0%, #0088cc 100%)';
        logEvent("⏸️ Speech Listener Paused.");
      }
    }

    function triggerParentAlertNow() {
      const phone = document.getElementById('parent-phone').value;
      const secret = document.getElementById('secret-codeword').value;

      logEvent(`🚨 PARENT EMERGENCY DISPATCH LAUNCHED!`);
      logEvent(`📞 Dialing Priority Call to: ${phone}`);
      logEvent(`💬 Dispatched Live Location SMS: https://silentsos.ai/track?lat=${lat}&lng=${lng}`);

      alert(`🚨 PARENT EMERGENCY DISPATCH!\n\n1. Voice Call Dialed to Parent: ${phone}\n2. Live Location SMS Sent: ${lat.toFixed(4)}° N, ${lng.toFixed(4)}° W\n3. Secret Code Word Triggered: "${secret}"`);
    }

    function logEvent(msg) {
      const box = document.getElementById('live-log-box');
      if (box) {
        const time = new Date().toTimeString().split(' ')[0];
        box.innerHTML = `[${time}] ${msg}<br>` + box.innerHTML;
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      initGPSMap();
      initSpeechRecognition();
    });
  </script>
</body>
</html>
